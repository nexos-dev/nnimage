image stressdisk
{
    type: gpt;
    size: 256MiB;
    bootmode: efi;
    partitions: p00, p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12, p13, p14, p15;
}

partition p00 { format: "fat32"; prefix: "/p00"; start: 1MiB; size: 8MiB; isboot: true; }
partition p01 { format: "ext4";  prefix: "/p01"; start: 9MiB; size: 8MiB; isboot: false; }
partition p02 { format: "ext4";  prefix: "/p02"; start: 17MiB; size: 8MiB; isboot: false; }
partition p03 { format: "ext4";  prefix: "/p03"; start: 25MiB; size: 8MiB; isboot: false; }
partition p04 { format: "ext4";  prefix: "/p04"; start: 33MiB; size: 8MiB; isboot: false; }
partition p05 { format: "ext4";  prefix: "/p05"; start: 41MiB; size: 8MiB; isboot: false; }
partition p06 { format: "ext4";  prefix: "/p06"; start: 49MiB; size: 8MiB; isboot: false; }
partition p07 { format: "ext4";  prefix: "/p07"; start: 57MiB; size: 8MiB; isboot: false; }
partition p08 { format: "ext4";  prefix: "/p08"; start: 65MiB; size: 8MiB; isboot: false; }
partition p09 { format: "ext4";  prefix: "/p09"; start: 73MiB; size: 8MiB; isboot: false; }
partition p10 { format: "ext4";  prefix: "/p10"; start: 81MiB; size: 8MiB; isboot: false; }
partition p11 { format: "ext4";  prefix: "/p11"; start: 89MiB; size: 8MiB; isboot: false; }
partition p12 { format: "ext4";  prefix: "/p12"; start: 97MiB; size: 8MiB; isboot: false; }
partition p13 { format: "ext4";  prefix: "/p13"; start: 105MiB; size: 8MiB; isboot: false; }
partition p14 { format: "ext4";  prefix: "/p14"; start: 113MiB; size: 8MiB; isboot: false; }
partition p15 { format: "ext4";  prefix: "/p15"; start: 121MiB; size: 8MiB; isboot: false; }
