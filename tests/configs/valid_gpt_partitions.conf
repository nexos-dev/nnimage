image disk0
{
    type: gpt;
    size: 64MiB;
    bootmode: efi;
    partitions: boot, root;
}

partition boot
{
    format: "fat32";
    prefix: "/boot";
    start: 1MiB;
    size: 16MiB;
    isboot: true;
}

partition root
{
    format: "ext4";
    prefix: "/";
    start: 17MiB;
    size: 47MiB;
    isboot: false;
}
