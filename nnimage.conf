# nnimage.conf - test configuration file

image test
{
    boot_mode: bios;
    format: raw;
    boot_emu: fdd;
    boot_image: test2;
    partitions: test1;
}

partition test1
{
    fs_type: iso9660;
    is_boot: true;
}

image test2
{
    size: 32MiB;
    boot_mode: bios;
    format: raw;
    type: mbr;
    partitions: test3;
}

partition test3
{
    fs_type: fat16;
    is_boot: true;
}
